[package]
name = "pdms_io"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = [] #
debug_parse = []

[dependencies]
anyhow = "1.0"
deku = "0.16.0"
memchr = "2.7.2"
aios_core = { path = "../new-crates/aios-core" }
parse_pdms_db = { path = "../aios-parse-pdms" }
nom = "7.1.3"
notify = "6.1.1"
futures = "0.3.28"
indexmap = "2.0.0"
walkdir = "2.3.3"
serde = "1.0.188"
tokio = { version = "1.32.0", features = ["full"] }
dashmap = "5.5.1"
serde_json = "1.0.105"
chrono = "0.4.31"
surrealdb = { path = "../surrealdb/sdk", default-features = false, features = ["protocol-ws"]}
reqwest = { version = "0.11.22", default-features = false, features = ["json", "rustls-tls"] }
rayon = "1.8.0"
#dpcsync = { path = "../dpc-sync" }
blake2 = "0.10.6"
futures-util = "0.3.29"
log = "0.4.20"
atty = "0.2.14"
num_cpus = "1.16.0"
url = "2.4.1"
fern = "0.6.2"
derivative = "2.2.0"
itertools = "0.13.0"
flume = "0.11.0"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
