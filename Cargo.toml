[package]
name = "pdms_io"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []            #
debug_parse = []
debug_btree_search = [] # 启用B+树搜索调试输出
legacy_session_replay = [] # 逐会话实体回放，仅诊断/对拍；生产依赖图默认不编译

[[bin]]
name = "benchmark_increment_eles"
path = "src/bin/benchmark_increment_eles.rs"
required-features = ["legacy_session_replay"]

[[bin]]
name = "demo_latest_data_save"
path = "src/bin/demo_latest_data_save.rs"
required-features = ["legacy_session_replay"]

[[bin]]
name = "test_get_refno_status"
path = "src/bin/test_get_refno_status.rs"
required-features = ["legacy_session_replay"]

[[bin]]
name = "test_increment_eles"
path = "src/bin/test_increment_eles.rs"
required-features = ["legacy_session_replay"]

[[bin]]
name = "test_meilisearch"
path = "src/bin/test_meilisearch.rs"
required-features = ["legacy_session_replay"]

[[bin]]
name = "test_search_integration"
path = "src/bin/test_search_integration.rs"
required-features = ["legacy_session_replay"]

[dependencies]
anyhow = "1.0"
deku = "0.16.0"
memchr = "2.7.2"
aios_core = { git = "https://github.com/happyrust/old-aios-core.git", rev = "0e391ff12bd66aebfdab8e3d2684754f43389510", default-features = false }
parse_pdms_db = { git = "https://github.com/happyrust/old-parse-pdms-db.git", rev = "5344440b01c2c12f6e919116e90c369985316f37" }
nom = "7.1.3"
notify = "8.0.0"
futures = "0.3.28"
indexmap = "2.0.0"
walkdir = "2.3.3"
serde = "1.0.188"
tokio = { version = "1.32.0", features = ["full"] }
dashmap = "6.1.0"
serde_json = "1.0.105"
chrono = "0.4.31"
surrealdb = { git = "https://gitee.com/happydpc/surrealdb", default-features = false, features = [
    "protocol-ws",
] }
reqwest = { version = "0.11.22", default-features = false, features = [
    "json",
    "rustls-tls",
] }
rayon = "1.8.0"
dpcsync = { git = "https://gitee.com/happydpc/dpc-sync", rev = "d7ce7fd848a138e5fc3ebd88ef55da00ee0ac780" }
blake2 = "0.10.6"
futures-util = "0.3.29"
log = "0.4.20"
atty = "0.2.14"
num_cpus = "1.16.0"
url = "2.4.1"
fern = "0.7.1"
derivative = "2.2.0"
itertools = "0.14.0"
flume = "0.11.0"
rand = "0.9.1"
iter_tools = "0.29.0"
meilisearch-sdk = "0.28.0"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3

